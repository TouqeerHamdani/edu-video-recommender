[project]
name = "edu-video-recommender"
version = "0.1.0"
description = "Educational Video Recommender API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = [
    "E402",  # module-level import not at top — intentional (load_dotenv before DB imports)
    "B008",  # Depends() in default args — FastAPI's documented pattern
]
# E: pycodestyle errors
# F: pyflakes
# B: bugbear
# I: isort

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
